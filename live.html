<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Where are you from? — Live</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}html,body,#map{height:100%;margin:0}body{font-family:Arial,sans-serif;overflow:hidden}#map{height:100vh}.panel{position:fixed;z-index:1000;top:18px;left:18px;background:#fff;padding:18px 22px;border-radius:16px;box-shadow:0 5px 28px #0003;min-width:270px}h1{margin:0;font-size:28px}.stats{margin-top:8px;color:#666}.count{font-size:28px;font-weight:800;color:#222}#list{margin-top:12px;max-height:45vh;overflow:auto}.row{display:flex;justify-content:space-between;gap:30px;padding:6px 0;border-bottom:1px solid #eee}.note{font-size:12px;color:#888;margin-top:10px}</style></head><body><div id="map"></div><div class="panel"><h1>WHERE ARE YOU FROM?</h1><div class="stats"><span id="people" class="count">0</span> persone · <span id="countries" class="count">0</span> Paesi</div><div id="list"></div><div class="note">Aggiornamento automatico</div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const U='https://moxytzkrlzthpcrtivbg.supabase.co',K='sb_publishable_FVDf2vyHJAykJ52481stOA_A5Ojf-3A',G='https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson';
const map=L.map('map',{minZoom:2,maxZoom:6,worldCopyJump:true,zoomControl:false}).setView([20,0],2);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);let gl,markers={};
async function rows(){let r=await fetch(U+'/rest/v1/responses?select=country_code,country_name',{headers:{apikey:K,Authorization:'Bearer '+K}});return r.json()}
function redraw(a){let c={};a.forEach(x=>{if(!c[x.country_code])c[x.country_code]={name:x.country_name,n:0};c[x.country_code].n++});Object.values(markers).forEach(m=>map.removeLayer(m));markers={};document.getElementById('people').textContent=a.length;document.getElementById('countries').textContent=Object.keys(c).length;if(gl)gl.eachLayer(l=>{let code=String(l.feature.properties.ISO_A3||'').toUpperCase(),n=c[code]?.n||0;l.setStyle({color:'#777',weight:1,fillColor:n?'#222':'#d8e5e2',fillOpacity:n?Math.min(.28+n*.08,.9):.65});if(n){let pt=l.getBounds().getCenter();markers[code]=L.circleMarker(pt,{radius:Math.min(8+n*2,28),color:'#222',fillColor:'#222',fillOpacity:.9,weight:1}).addTo(map).bindTooltip(c[code].name+' · '+n)}});let s=Object.values(c).sort((x,y)=>y.n-x.n);document.getElementById('list').innerHTML=s.slice(0,10).map(x=>'<div class="row"><span>'+x.name+'</span><strong>'+x.n+'</strong></div>').join('')}
Promise.all([fetch(G).then(r=>r.json()),rows()]).then(([g,a])=>{gl=L.geoJSON(g,{style:{color:'#777',weight:1,fillColor:'#d8e5e2',fillOpacity:.65}}).addTo(map);redraw(a);setInterval(()=>rows().then(redraw),3000)}).catch(console.error);
</script></body></html>
