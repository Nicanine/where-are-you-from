function markerSize(n){return Math.min(24+Math.sqrt(n)*15,72)}
function makeIcon(n){const s=markerSize(n);return L.divIcon({className:'',html:`<div class="country-marker" style="width:${s}px;height:${s}px;font-size:${Math.max(13,Math.min(22,s*.34))}px">${n}</div>`,iconSize:[s,s],iconAnchor:[s/2,s/2]})}
