      background: white;

      z-index: 1000;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 52px);
      letter-spacing: 2px;
    }

    .subtitle {
      margin-top: 8px;
      font-size: clamp(16px, 2vw, 24px);
      color: #667085;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 50px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .stat {
      text-align: center;
    }

    .stat-number {
      font-size: clamp(28px, 4vw, 46px);
      font-weight: bold;
    }

    .stat-label {
      font-size: 14px;
      color: #667085;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #map {
      height: calc(100vh - 205px);
      min-height: 500px;
      width: 100%;
    }

    .country-marker {
      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: rgba(37, 99, 235, 0.85);
      border: 3px solid white;

      color: white;
      font-weight: bold;

      box-shadow: 0 3px 12px rgba(0,0,0,0.30);

      text-align: center;
    }

    .country-label {
      background: white;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      padding: 4px 8px;

      font-size: 13px;
      font-weight: bold;

      box-shadow: 0 2px 6px rgba(0,0,0,0.15);

      white-space: nowrap;
    }

    .leaflet-tooltip.country-label::before {
      display: none;
    }

    .error {
      position: fixed;
      left: 20px;
      right: 20px;
      bottom: 20px;

      background: #b42318;
      color: white;

      padding: 15px;
      border-radius: 8px;

      display: none;
      z-index: 2000;

  /* =========================================================

  let markers = {};


  /* =========================================================

     ========================================================= */

  function showError(message) {

    const box = document.getElementById("error");

    box.textContent = message;
    box.style.display = "block";

  }


  /* =========================================================
     CREA / AGGIORNA INDICATORE
     ========================================================= */

  function createMarker(code, count) {

    const position = countryPositions[code];

    if (!position) {
      console.warn(
        "Coordinate non disponibili per:",
        code
      );
      return;
    }


    /*
     * Dimensione del cerchio.
     *
     * Con 1 persona = cerchio piccolo.
     * Con molte persone = cerchio progressivamente più grande.
     */

    const size = Math.min(
      22 + Math.sqrt(count) * 12,
      90
    );


    const icon = L.divIcon({

      className: "",

      html:
        `<div class="country-marker"
              style="
                width:${size}px;
                height:${size}px;
                font-size:${Math.max(13, size / 3)}px;
              ">
            ${count}
         </div>`,

      iconSize: [size, size],

      iconAnchor: [
        size / 2,
        size / 2
      ]

    });


    const marker = L.marker(
      position,
      { icon: icon }
    );


    marker.bindTooltip(
      `${countryNames[code] || code}: ${count}`,
      {
        permanent: true,
        direction: "top",
        offset: [0, -size / 2],
        className: "country-label"
      }
    );


    marker.addTo(map);


    markers[code] = marker;

  }


  /* =========================================================
     AGGIORNA LA MAPPA
     ========================================================= */

  function updateMap(counts) {


    /* Rimuoviamo gli indicatori precedenti */

    Object.values(markers).forEach(
      marker => map.removeLayer(marker)
    );

    markers = {};


    /* Creiamo quelli aggiornati */

    Object.entries(counts).forEach(
      ([code, count]) => {

        if (count > 0) {
          createMarker(code, count);
        }

      }
    );

  }


  /* =========================================================
     CARICA RISPOSTE DA SUPABASE
     ========================================================= */

  async function loadResponses() {

    try {

      const response = await fetch(
        SUPABASE_URL +
        "/rest/v1/responses?select=country_code,country_name",
        {
          method: "GET",

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
              "Bearer " + SUPABASE_KEY
          }
        }
      );


      if (!response.ok) {

        const errorText =
          await response.text();

        throw new Error(
          "Supabase: " +
          response.status +
          " – " +
          errorText
        );

      }


      const data =
        await response.json();


      /* Conteggi */

      const counts = {};


      data.forEach(row => {

        const code =
          String(row.country_code)
          .trim()
          .toUpperCase();


        if (!counts[code]) {
          counts[code] = 0;
        }

        counts[code]++;

      });


      /* Statistiche */

      const totalPeople =
        data.length;


      const totalCountries =
        Object.keys(counts).length;


      document.getElementById(
        "totalPeople"
      ).textContent = totalPeople;


      document.getElementById(
        "totalCountries"
      ).textContent = totalCountries;


      /* Mappa */

      updateMap(counts);


      console.log(
        "Risposte ricevute:",
        data
      );


      console.log(
        "Conteggi:",
        counts
      );

    }

    catch (error) {

      console.error(error);

      showError(
        "Errore nel caricamento dei dati: " +
        error.message
      );

    }

  }


  /* =========================================================
     AVVIO
     ========================================================= */

createMarker("ITA", 1);
