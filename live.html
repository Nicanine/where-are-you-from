<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<title>Where Are You From? – Live</title>

  rel="stylesheet"

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #08111f,
      #10243a
    );

  color: white;
}


/* =========================================================
   HEADER
   ========================================================= */

header {

  height: 150px;

  padding:
    20px 40px 15px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  position: relative;

  z-index: 1000;
}


.title {
  text-align: left;
}


.title h1 {

  margin: 0;

  font-size:
    clamp(30px, 4vw, 58px);

  letter-spacing: 4px;

  font-weight: 800;
}


.title p {

  margin:
    8px 0 0;

  font-size:
    clamp(15px, 1.5vw, 22px);

  opacity: 0.75;
}


/* =========================================================
   STATISTICS
   ========================================================= */

.stats {

  display: flex;

  gap: 25px;
}


.stat {

  min-width: 170px;

  padding:
    12px 24px;

  border-radius: 16px;

  background:
    rgba(255,255,255,0.10);

  border:
    1px solid rgba(255,255,255,0.18);

  text-align: center;

  backdrop-filter:
    blur(8px);
}


.stat-number {

  font-size:
    clamp(32px, 4vw, 54px);

  line-height: 1;

  font-weight: 800;
}


.stat-label {

  margin-top: 6px;

  font-size: 12px;

  letter-spacing: 2px;

  opacity: 0.7;
}


/* =========================================================
   MAIN AREA
   ========================================================= */

.main {

  height:
    calc(100vh - 150px);

  display: flex;

  position: relative;
}


/* =========================================================
   MAP
   ========================================================= */

#map {

  flex: 1;

  height: 100%;

  background:
    #0d2034;
}


.leaflet-tile {

  filter:
    brightness(0.55)
    saturate(0.65)
    contrast(1.05);
}


/* =========================================================
   RANKING PANEL
   ========================================================= */

.ranking {

  width: 290px;

  padding:
    20px;

  background:
    rgba(5,15,27,0.90);

  border-left:
    1px solid rgba(255,255,255,0.12);

  overflow-y: auto;
}


.ranking h2 {

  margin:
    0 0 18px;

  font-size: 18px;

  letter-spacing: 2px;
}


.rank {

  display: flex;

  align-items: center;

  gap: 10px;

  padding:
    9px 0;

  border-bottom:
    1px solid rgba(255,255,255,0.08);
}


.rank-position {

  width: 25px;

  opacity: 0.5;

  font-weight: bold;
}


.rank-name {

  flex: 1;

  font-size: 15px;
}


.rank-count {

  font-size: 17px;

  font-weight: bold;
}


/* =========================================================
   COUNTRY MARKERS
   ========================================================= */

.country-marker {

  display: flex;

  align-items: center;

  justify-content: center;

  border-radius: 50%;

  background:
    rgba(255,255,255,0.92);

  border:
    4px solid rgba(255,255,255,0.85);

  color:
    #10243a;

  font-weight:
    900;

  box-shadow:
    0 0 0 4px rgba(255,255,255,0.15),
    0 5px 20px rgba(0,0,0,0.45);
}


.country-label {

  background:
    rgba(5,15,27,0.92);

  color: white;

  border:
    1px solid rgba(255,255,255,0.25);

  border-radius: 8px;

  padding:
    5px 9px;

  font-size: 13px;

  font-weight: bold;

  box-shadow:
    0 3px 10px rgba(0,0,0,0.4);
}


.leaflet-tooltip.country-label::before {

  display: none;
}


/* =========================================================
   ERROR
   ========================================================= */

#error {

  display: none;

  position: fixed;

  bottom: 20px;

  left: 20px;

  right: 20px;

  padding: 15px;

  background: #b42318;

  color: white;

  border-radius: 10px;

  z-index: 5000;
}

<div class="main">

<script>

/* =========================================================

const SUPABASE_URL =

const SUPABASE_KEY =

/* =========================================================
   MAP
   ========================================================= */

  L.map("map", {

    worldCopyJump: false,

    minZoom: 2,

    maxZoom: 6

/* =========================================================

   ========================================================= */

const countryNames = {

/* =========================================================
   MARKERS
   ========================================================= */

let markers = {};


function createMarker(code, count) {

  const position =
    countryPositions[code];

  if (!position) return;


  const size =
    Math.min(
      28 + Math.sqrt(count) * 14,
      100
    );


  const icon =
    L.divIcon({

      className: "",

      html:
        `<div
          class="country-marker"
          style="
            width:${size}px;
            height:${size}px;
            font-size:${Math.max(15, size / 3)}px;
          "
        >
          ${count}
        </div>`,

      iconSize:
        [size, size],

      iconAnchor:
        [size / 2, size / 2]

    });


  const marker =
    L.marker(
      position,
      { icon: icon }
    );


  marker.bindTooltip(

    `${countryNames[code] || code}: ${count}`,

    {

      permanent: true,

      direction: "top",

      offset:
        [0, -size / 2],

      className:
        "country-label"

    }

  );


  marker.addTo(map);

  markers[code] = marker;

}


/* =========================================================
   UPDATE MAP
   ========================================================= */

function updateMap(counts) {


  Object.entries(counts)
    .forEach(
      ([code, count]) => {

        if (count <= 0) return;


        if (markers[code]) {

          const size =
            Math.min(
              28 + Math.sqrt(count) * 14,
              100
            );


          const icon =
            L.divIcon({

              className: "",

              html:
                `<div
                  class="country-marker"
                  style="
                    width:${size}px;
                    height:${size}px;
                    font-size:${Math.max(15, size / 3)}px;
                  "
                >
                  ${count}
                </div>`,

              iconSize:
                [size, size],

              iconAnchor:
                [size / 2, size / 2]

            });


          markers[code]
            .setIcon(icon);


          markers[code]
            .unbindTooltip();


          markers[code]
            .bindTooltip(

              `${countryNames[code] || code}: ${count}`,

              {

                permanent: true,

                direction: "top",

                offset:
                  [0, -size / 2],

                className:
                  "country-label"

              }

            );

        }

        else {

          createMarker(
            code,
            count
          );

        }

      });


  Object.keys(markers)
    .forEach(code => {

      if (!counts[code]) {

        map.removeLayer(
          markers[code]
        );

        delete markers[code];

      }

    });

}


/* =========================================================
   RANKING
   ========================================================= */

function updateRanking(counts) {

  const list =
    document.getElementById(
      "rankingList"
    );


  const sorted =
    Object.entries(counts)
      .sort(
        (a,b) => b[1] - a[1]
      )
      .slice(0, 10);


  list.innerHTML = "";


  sorted.forEach(
    ([code, count], index) => {

      const row =
        document.createElement("div");

      row.className =
        "rank";


      row.innerHTML = `

        <div class="rank-position">
          ${index + 1}
        </div>

        <div class="rank-name">
          ${countryNames[code] || code}
        </div>

        <div class="rank-count">
          ${count}
        </div>

      `;


      list.appendChild(row);

    });

}


/* =========================================================
   LOAD DATA
   ========================================================= */

async function loadResponses() {

  try {

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/responses?select=country_code,country_name",

        {

          method: "GET",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY

          }

        }

      );


    if (!response.ok) {

      throw new Error(
        "Supabase error: " +
        response.status
      );

    }


    const data =
      await response.json();


    const counts = {};


    data.forEach(row => {

      const code =
        String(
          row.country_code
        )
        .trim()
        .toUpperCase();


      if (!counts[code]) {

        counts[code] = 0;

      }


      counts[code]++;

    });


    /* STATISTICS */

    document.getElementById(
      "totalPeople"
    )
    .textContent =
      data.length;


    document.getElementById(
      "totalCountries"
    )
    .textContent =
      Object.keys(counts).length;


    /* MAP */

    updateMap(
      counts
    );


    /* RANKING */

    updateRanking(
      counts
    );


    console.log(
      "Responses:",
      data
    );

  }

  catch(error) {

    console.error(
      error
    );


    const errorBox =
      document.getElementById(
        "error"
      );


    errorBox.textContent =
      error.message;


    errorBox.style.display =
      "block";

  }

}


/* =========================================================
   START
   ========================================================= */

loadResponses();


setInterval(
  loadResponses,
  3000
);

</script>
