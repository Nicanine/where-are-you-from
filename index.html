<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Where Are You From?</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#eaf7fb,#fff);color:#173042}
.container{width:100%;max-width:700px;margin:0 auto;padding:35px 20px 50px}
header{text-align:center;margin-bottom:28px}
h1{margin:0;font-size:clamp(32px,8vw,48px);font-weight:800;letter-spacing:.03em}
.subtitle{margin-top:10px;font-size:17px;color:#61798a}
.search-box{position:sticky;top:0;z-index:10;padding:8px 0 15px;background:rgba(255,255,255,.96)}
#search{width:100%;padding:16px 18px;border:2px solid #d5e2e8;border-radius:14px;font-size:17px;outline:none}
#search:focus{border-color:#5bcdf0}
.country-list{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.country{padding:14px 10px;border:1px solid #dce7eb;border-radius:12px;background:#fff;font-size:15px;text-align:center;cursor:pointer;transition:.15s}
.country:hover{border-color:#5bcdf0;transform:translateY(-1px)}
.country.selected{background:#dff7ff;border-color:#43c5ea;font-weight:700}
.selected-area{display:none;margin-top:25px;padding:20px;background:#fff;border-radius:16px;border:1px solid #dce7eb;text-align:center}
.selected-area.visible{display:block}
.selected-label{color:#718796;font-size:14px}
.selected-country{margin-top:6px;font-size:24px;font-weight:800}
.buttons{display:flex;gap:10px;margin-top:18px}
button{flex:1;padding:15px;border-radius:12px;border:none;font-size:16px;font-weight:700;cursor:pointer}
.confirm{background:#173042;color:#fff}
.confirm:hover{background:#24495e}
.cancel{background:#edf2f4;color:#173042}
button:disabled{opacity:.6;cursor:wait}
.message{display:none;text-align:center;margin-top:35px;padding:28px 20px;background:#fff;border-radius:18px}
.message.visible{display:block}
.message h2{margin-top:0;font-size:28px}
.message p{color:#61798a;line-height:1.5}
.hidden{display:none!important}
.no-results{text-align:center;color:#718796;padding:25px}
@media(max-width:480px){.container{padding:25px 15px 35px}.country-list{grid-template-columns:1fr 1fr}.country{font-size:14px;padding:13px 7px}}
</style>
</head>
<body>
<div class="container">
<header>
<h1>WHERE ARE YOU FROM?</h1>
<div class="subtitle">Choose the country you come from</div>
</header>

<div id="questionnaire">
<div class="search-box">
<input id="search" type="text" placeholder="Search for your country..." autocomplete="off">
</div>
<div id="country-list" class="country-list"></div>

<div id="selected-area" class="selected-area">
<div class="selected-label">Selected country</div>
<div id="selected-country" class="selected-country"></div>
<div class="buttons">
<button id="cancel" class="cancel" type="button">CANCEL</button>
<button id="confirm" class="confirm" type="button">CONFIRM</button>
</div>
</div>
</div>

<div id="success" class="message">
<h2>Thank you! 🌍</h2>
<p>Your answer has been added to the live map.</p>
</div>

<div id="already" class="message">
<h2>Thank you! 🌍</h2>
<p>Your response has already been recorded on this device.</p>
</div>

<div id="error" class="message">
<h2>Something went wrong</h2>
<p>Sorry, your answer could not be recorded. Please try again.</p>
</div>
</div>

<script>

const SUPABASE_KEY="sb_publishable_FVDf2vyHJAykJ52481stOA_A5Ojf-3A";

];

const countryList=document.getElementById("country-list");
const search=document.getElementById("search");
const selectedArea=document.getElementById("selected-area");
const selectedCountry=document.getElementById("selected-country");
const confirmButton=document.getElementById("confirm");
const cancelButton=document.getElementById("cancel");
let selected=null;

function displayCountries(list){
countryList.innerHTML="";
if(list.length===0){
countryList.innerHTML='<div class="no-results">No country found.</div>';
return;
}
list.forEach(function(country){
const code=country[0],name=country[1];
const item=document.createElement("div");
item.className="country";
item.textContent=name;
item.dataset.code=code;
item.addEventListener("click",function(){selectCountry(code,name,item);});
countryList.appendChild(item);
});
}

function selectCountry(code,name,element){
selected={code:code,name:name};
document.querySelectorAll(".country").forEach(function(item){item.classList.remove("selected");});
element.classList.add("selected");
selectedCountry.textContent=name;
selectedArea.classList.add("visible");
selectedArea.scrollIntoView({behavior:"smooth",block:"nearest"});
}

search.addEventListener("input",function(){
const term=search.value.trim().toLowerCase();
displayCountries(countries.filter(function(country){return country[1].toLowerCase().includes(term);}));
});

cancelButton.addEventListener("click",function(){
selected=null;
selectedArea.classList.remove("visible");
document.querySelectorAll(".country").forEach(function(item){item.classList.remove("selected");});
});

confirmButton.addEventListener("click",async function(){
if(!selected)return;
confirmButton.disabled=true;
cancelButton.disabled=true;
confirmButton.textContent="SENDING...";
try{
const response=await fetch(SUPABASE_URL+"/rest/v1/responses",{
method:"POST",
headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY,
"Prefer":"return=minimal"
},
body:JSON.stringify({country_code:selected.code,country_name:selected.name})
});
if(!response.ok)throw new Error("Submission failed: "+response.status);
localStorage.setItem("whereAreYouFromSubmitted","true");
document.getElementById("questionnaire").classList.add("hidden");
document.getElementById("success").classList.add("visible");
}catch(error){
console.error(error);
confirmButton.disabled=false;
cancelButton.disabled=false;
confirmButton.textContent="CONFIRM";
document.getElementById("error").classList.add("visible");
}
});

if(localStorage.getItem("whereAreYouFromSubmitted")==="true"){
document.getElementById("questionnaire").classList.add("hidden");
document.getElementById("already").classList.add("visible");
}

displayCountries(countries);
</script>
</body>
</html>
