<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  background: #f7f5ef;
  color: #171717;
}

header {
  padding: 20px 22px 16px;
  background: white;
  text-align: center;
}

h1 {
  margin: 0;
  font-size: clamp(30px, 7vw, 52px);
  letter-spacing: -1.5px;
}

.subtitle {
  margin-top: 7px;
  color: #555;
  font-size: 17px;
}

.controls {
  background: white;
  padding: 0 18px 18px;
  display: flex;
  justify-content: center;
  position: relative;
  z-index: 1001;
}

.searchBox {
  position: relative;
  width: min(520px, 90vw);
}

#search {
  width: 100%;
  padding: 13px 15px;
  border: 1px solid #ccc;
  border-radius: 12px;
  font-size: 16px;
}

#suggestions {
  position: absolute;
  top: 50px;
  left: 0;
  width: 100%;
  max-height: 240px;
  overflow-y: auto;
  background: white;
  border: 1px solid #ddd;
  border-radius: 12px;
  box-shadow: 0 5px 20px #0002;
  display: none;
}

.suggestion {
  padding: 12px 15px;
  cursor: pointer;
}

.suggestion:hover {
  background: #f0f0f0;
}

#map {
  height: calc(100vh - 178px);
  min-height: 430px;
}

#selected {
  position: fixed;
  z-index: 2000;
  left: 50%;
  bottom: 20px;
  transform: translateX(-50%);
  background: white;
  padding: 18px;
  border-radius: 16px;
  box-shadow: 0 5px 25px #0003;
  display: none;
  width: min(360px, 90vw);
  text-align: center;
}

#countryLabel {
  font-size: 21px;
  font-weight: bold;
  margin-bottom: 10px;
}

#message {
  font-size: 17px;
  line-height: 1.4;
  margin-bottom: 12px;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 12px 18px;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
}

#confirm {
  background: #171717;
  color: white;
  margin-left: 7px;
}

#cancel {
  background: #eee;
}

@media (max-width: 600px) {
  #map {
    height: calc(100vh - 205px);
  }

  header {
    padding-top: 16px;
  }

  .subtitle {
    font-size: 15px;
  }
}
</style>
</head>

<body>

<header>
  <h1>WHERE ARE YOU FROM?</h1>
  <div class="subtitle">
    Scegli il Paese da cui provieni
  </div>
</header>

<div class="controls">
  <div class="searchBox">

    <input
      id="search"
      type="search"
      placeholder="Cerca un Paese…"
      autocomplete="off"
    >

    <div id="suggestions"></div>

  </div>
</div>

<div id="map"></div>

<div id="selected">

  <div id="countryLabel"></div>

  <div id="message"></div>

  <div id="buttons">

    <button id="cancel">
      Annulla
    </button>

    <button id="confirm">
      Conferma
    </button>

  </div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =====================================================
   SUPABASE
   ===================================================== */

const SUPABASE_URL =
"https://moxytzkrlzthpcrtivbg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_FVDf2vyHJAykJ52481stOA_A5Ojf-3A";


/* =====================================================
   MAPPA
   ===================================================== */

const GEOJSON_URL =
"https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson";


const map = L.map("map", {
  minZoom: 2,
  maxZoom: 6,
  worldCopyJump: true
}).setView([20, 0], 2);


L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution: "© OpenStreetMap contributors"
  }
).addTo(map);

/* =====================================================
   FUNZIONI
   ===================================================== */

let geoLayer = null;
let selected = null;

const byCode = {};

countries.forEach(country => {
  byCode[country[0]] = country;
});


function getFeatureCode(properties) {

  return String(
    properties.ISO_A3 ||
    properties.iso_a3 ||
    properties.ADM0_A3 ||
    ""
  ).toUpperCase();

}


function showSelected(country) {

  selected = country;

  document.getElementById("countryLabel")
    .textContent = country[1];

  document.getElementById("message")
    .textContent = "";

  document.getElementById("buttons")
    .style.display = "block";

  document.getElementById("selected")
    .style.display = "block";

}


function clearSelection() {

  selected = null;

  document.getElementById("selected")
    .style.display = "none";

}


/* =====================================================
   CARICAMENTO MAPPA
   ===================================================== */

fetch(GEOJSON_URL)

.then(response => response.json())

.then(data => {

  geoLayer = L.geoJSON(data, {

    style: {
      color: "#777",
      weight: 1,
      fillColor: "#d9e7e4",
      fillOpacity: 0.72
    },

    onEachFeature: function(feature, layer) {

      const properties =
        feature.properties || {};

      const code =
        getFeatureCode(properties);

      const known =
        byCode[code];

      const name =
        known
        ? known[1]
        : (
          properties.ADMIN ||
          properties.NAME ||
          properties.name ||
          ""
        );

      if (name) {
        layer.bindTooltip(name);
      }

      layer.on("click", function() {

        if (known) {
          showSelected(known);
        }

      });

    }

  }).addTo(map);

})

.catch(function(error) {

  console.error(
    "Errore caricamento mappa:",
    error
  );

});


/* =====================================================
   RICERCA PAESI
   ===================================================== */

const search =
  document.getElementById("search");

const suggestions =
  document.getElementById("suggestions");


search.addEventListener("input", function() {

  const query =
    search.value.trim().toLowerCase();

  suggestions.innerHTML = "";

  if (!query) {

    suggestions.style.display = "none";

    return;
  }


  const matches =
    countries
      .filter(country =>
        country[1]
          .toLowerCase()
          .includes(query)
      )
      .slice(0, 10);


  matches.forEach(function(country) {

    const item =
      document.createElement("div");

    item.className = "suggestion";

    item.textContent =
      country[1];


    item.addEventListener(
      "click",
      function() {

        search.value =
          country[1];

        suggestions.style.display =
          "none";

        showSelected(country);

      }
    );


    suggestions.appendChild(item);

  });


  suggestions.style.display =
    matches.length
    ? "block"
    : "none";

});


/* =====================================================
   ANNULLA
   ===================================================== */

document
  .getElementById("cancel")
  .addEventListener("click", function() {

    clearSelection();

  });


/* =====================================================
   CONFERMA
   ===================================================== */

document
  .getElementById("confirm")
  .addEventListener("click", async function() {

    if (!selected) {
      return;
    }


    /* Controllo risposta già inviata */

    if (
      localStorage.getItem(
        "whereAreYouFromSubmitted"
      )
    ) {

      document.getElementById(
        "countryLabel"
      ).textContent =
        "Risposta già registrata";

      document.getElementById(
        "message"
      ).textContent =
        "Da questo browser è già stata inviata una risposta.";

      document.getElementById(
        "buttons"
      ).style.display =
        "none";

      return;
    }


    /* Invio a Supabase */

    try {

      const response =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/responses",
          {

            method: "POST",

            headers: {

              "apikey":
                SUPABASE_KEY,

              "Authorization":
                "Bearer " +
                SUPABASE_KEY,

              "Content-Type":
                "application/json",

              "Prefer":
                "return=minimal"

            },

            body: JSON.stringify({

              country_code:
                selected[0],

              country_name:
                selected[1]

            })

          }
        );


      if (!response.ok) {

        const errorText =
          await response.text();

        console.error(
          "Supabase:",
          errorText
        );

        document.getElementById(
          "message"
        ).textContent =
          "Non è stato possibile registrare la risposta. Riprova.";

        return;

      }


      /* Risposta registrata */

      localStorage.setItem(
        "whereAreYouFromSubmitted",
        "1"
      );


      document.getElementById(
        "countryLabel"
      ).textContent =
        "Grazie! 🌍";


      document.getElementById(
        "message"
      ).textContent =
        "La tua risposta è stata aggiunta alla mappa.";


      document.getElementById(
        "buttons"
      ).style.display =
        "none";


    }

    catch(error) {

      console.error(error);

      document.getElementById(
        "message"
      ).textContent =
        "Errore di connessione. Riprova.";

    }

  });

</script>
