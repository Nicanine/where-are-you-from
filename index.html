<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Where Are You From?</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

/* =========================================================
   BASE
   ========================================================= */

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #08111f,
      #10243a
    );

  color: white;

  min-height: 100vh;

}


/* =========================================================
   MAIN CONTAINER
   ========================================================= */

.container {

  width: 100%;

  max-width: 900px;

  margin: 0 auto;

  padding:
    30px 20px 40px;

  text-align: center;

}


/* =========================================================
   TITLE
   ========================================================= */

h1 {

  margin:
    10px 0 8px;

  font-size:
    clamp(34px, 8vw, 64px);

  letter-spacing:
    3px;

  font-weight:
    800;

}


.subtitle {

  margin:
    0 0 30px;

  font-size:
    clamp(18px, 4vw, 25px);

  opacity:
    0.8;

}


/* =========================================================
   SEARCH
   ========================================================= */

.search-box {

  width: 100%;

  max-width: 650px;

  margin:
    0 auto 20px;

}


#countrySearch {

  width: 100%;

  padding:
    16px 20px;

  border-radius:
    12px;

  border:
    none;

  font-size:
    18px;

  outline:
    none;

}


#countrySearch:focus {

  box-shadow:
    0 0 0 3px
    rgba(255,255,255,0.3);

}


/* =========================================================
   COUNTRY LIST
   ========================================================= */

#countryList {

  width: 100%;

  max-width: 650px;

  margin:
    0 auto;

  display: grid;

  grid-template-columns:
    repeat(auto-fit, minmax(180px, 1fr));

  gap:
    10px;

}


.country-button {

  padding:
    13px 10px;

  border-radius:
    10px;

  border:
    1px solid
    rgba(255,255,255,0.18);

  background:
    rgba(255,255,255,0.09);

  color:
    white;

  font-size:
    15px;

  cursor:
    pointer;

  transition:
    0.15s;

}


.country-button:hover {

  background:
    rgba(255,255,255,0.18);

  transform:
    translateY(-1px);

}


.country-button.selected {

  background:
    rgba(255,255,255,0.95);

  color:
    #10243a;

  font-weight:
    bold;

}


/* =========================================================
   MAP
   ========================================================= */

#map {

  width: 100%;

  max-width: 900px;

  height: 420px;

  margin:
    30px auto 0;

  border-radius:
    16px;

  overflow:
    hidden;

  border:
    1px solid
    rgba(255,255,255,0.15);

}


/* =========================================================
   CONFIRM AREA
   ========================================================= */

#confirmArea {

  display:
    none;

  margin-top:
    25px;

}


.selected-country {

  font-size:
    22px;

  font-weight:
    bold;

  margin-bottom:
    15px;

}


button.action {

  border:
    none;

  border-radius:
    12px;

  padding:
    15px 30px;

  font-size:
    18px;

  font-weight:
    bold;

  cursor:
    pointer;

  margin:
    5px;

}


#confirmButton {

  background:
    white;

  color:
    #10243a;

}


#cancelButton {

  background:
    rgba(255,255,255,0.12);

  color:
    white;

  border:
    1px solid
    rgba(255,255,255,0.25);

}


/* =========================================================
   MESSAGE
   ========================================================= */

#message {

  display:
    none;

  margin-top:
    35px;

  padding:
    25px;

  border-radius:
    16px;

  background:
    rgba(255,255,255,0.10);

  font-size:
    21px;

  line-height:
    1.5;

}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

  .container {

    padding:
      22px 15px 30px;

  }

  h1 {

    font-size:
      34px;

    letter-spacing:
      2px;

  }

  .subtitle {

    font-size:
      18px;

    margin-bottom:
      22px;

  }

  #countryList {

    grid-template-columns:
      repeat(2, 1fr);

    gap:
      8px;

  }

  .country-button {

    padding:
      12px 6px;

    font-size:
      14px;

  }

  #map {

    height:
      330px;

    margin-top:
      20px;

  }

}

</style>

</head>


<body>


<div class="container">


  <h1>
    WHERE ARE YOU FROM?
  </h1>


  <div class="subtitle">
    Choose the country you come from
  </div>


  <div class="search-box">

    <input
      type="text"
      id="countrySearch"
      placeholder="Search for your country..."
      autocomplete="off"
    >

  </div>


  <div id="countryList"></div>


  <div id="map"></div>


  <div id="confirmArea">

    <div
      class="selected-country"
      id="selectedCountryText">
    </div>


    <button
      class="action"
      id="confirmButton"
    >
      CONFIRM
    </button>


    <button
      class="action"
      id="cancelButton"
    >
      CANCEL
    </button>

  </div>


  <div id="message"></div>


</div>


<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
  "https://moxytzkrlzthpcrtivbg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_FVDf2vyHJAykJ52481stOA_A5Ojf-3A";


/* =========================================================
   COUNTRY LIST
   ========================================================= */

const countries = [

  ["AFG","Afghanistan"],
  ["ALB","Albania"],
  ["DZA","Algeria"],
  ["AND","Andorra"],
  ["AGO","Angola"],
  ["ARG","Argentina"],
  ["ARM","Armenia"],
  ["AUS","Australia"],
  ["AUT","Austria"],
  ["AZE","Azerbaijan"],

  ["BEL","Belgium"],
  ["BOL","Bolivia"],
  ["BIH","Bosnia and Herzegovina"],
  ["BRA","Brazil"],
  ["BGR","Bulgaria"],

  ["CAN","Canada"],
  ["CHL","Chile"],
  ["CHN","China"],
  ["COL","Colombia"],
  ["HRV","Croatia"],
  ["CYP","Cyprus"],
  ["CZE","Czech Republic"],

  ["DNK","Denmark"],
  ["DOM","Dominican Republic"],

  ["ECU","Ecuador"],
  ["EGY","Egypt"],
  ["EST","Estonia"],
  ["ETH","Ethiopia"],

  ["FIN","Finland"],
  ["FRA","France"],

  ["GEO","Georgia"],
  ["DEU","Germany"],
  ["GHA","Ghana"],
  ["GRC","Greece"],

  ["HUN","Hungary"],

  ["ISL","Iceland"],
  ["IND","India"],
  ["IDN","Indonesia"],
  ["IRN","Iran"],
  ["IRQ","Iraq"],
  ["IRL","Ireland"],
  ["ISR","Israel"],
  ["ITA","Italy"],

  ["JPN","Japan"],
  ["JOR","Jordan"],

  ["KAZ","Kazakhstan"],
  ["KEN","Kenya"],
  ["KOR","South Korea"],

  ["LVA","Latvia"],
  ["LBN","Lebanon"],
  ["LTU","Lithuania"],
  ["LUX","Luxembourg"],

  ["MYS","Malaysia"],
  ["MLT","Malta"],
  ["MEX","Mexico"],
  ["MDA","Moldova"],
  ["MNE","Montenegro"],
  ["MAR","Morocco"],

  ["NLD","Netherlands"],
  ["NZL","New Zealand"],
  ["NGA","Nigeria"],
  ["MKD","North Macedonia"],
  ["NOR","Norway"],

  ["PAK","Pakistan"],
  ["PRY","Paraguay"],
  ["PER","Peru"],
  ["PHL","Philippines"],
  ["POL","Poland"],
  ["PRT","Portugal"],

  ["ROU","Romania"],
  ["RUS","Russia"],

  ["SAU","Saudi Arabia"],
  ["SEN","Senegal"],
  ["SRB","Serbia"],
  ["SGP","Singapore"],
  ["SVK","Slovakia"],
  ["SVN","Slovenia"],
  ["ZAF","South Africa"],
  ["ESP","Spain"],
  ["SWE","Sweden"],
  ["CHE","Switzerland"],

  ["THA","Thailand"],
  ["TUN","Tunisia"],
  ["TUR","Turkey"],

  ["UKR","Ukraine"],
  ["ARE","United Arab Emirates"],
  ["GBR","United Kingdom"],
  ["USA","United States"],
  ["URY","Uruguay"],
  ["UZB","Uzbekistan"],

  ["VEN","Venezuela"],
  ["VNM","Vietnam"],

  ["ZMB","Zambia"],
  ["ZWE","Zimbabwe"]

];


/* =========================================================
   MAP
   ========================================================= */

const map =
  L.map("map")
   .setView(
     [25, 10],
     2
   );


L.tileLayer(

  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

  {

    attribution:
      "&copy; OpenStreetMap contributors"

  }

).addTo(map);


/* =========================================================
   VARIABLES
   ========================================================= */

let selected = null;


/* =========================================================
   COUNTRY LIST DISPLAY
   ========================================================= */

function displayCountries(list) {

  const container =
    document.getElementById(
      "countryList"
    );


  container.innerHTML = "";


  list.forEach(country => {

    const button =
      document.createElement(
        "button"
      );


    button.className =
      "country-button";


    button.textContent =
      country[1];


    button.onclick =
      () => selectCountry(country);


    container.appendChild(
      button
    );

  });

}


/* =========================================================
   SEARCH
   ========================================================= */

document
  .getElementById(
    "countrySearch"
  )
  .addEventListener(
    "input",
    function() {

      const query =
        this.value
          .toLowerCase()
          .trim();


      const filtered =
        countries.filter(
          country =>
            country[1]
              .toLowerCase()
              .includes(query)
        );


      displayCountries(
        filtered
      );

    }
  );


/* =========================================================
   SELECT COUNTRY
   ========================================================= */

function selectCountry(country) {

  selected = country;


  document.getElementById(
    "selectedCountryText"
  )
  .textContent =
    `Selected country: ${country[1]}`;


  document.getElementById(
    "confirmArea"
  )
  .style.display =
    "block";


  /*
   * Scroll gently to the confirmation area.
   */

  document.getElementById(
    "confirmArea"
  )
  .scrollIntoView({
    behavior: "smooth",
    block: "center"
  });

}


/* =========================================================
   CANCEL
   ========================================================= */

document
  .getElementById(
    "cancelButton"
  )
  .onclick =
  function() {

    selected = null;


    document.getElementById(
      "confirmArea"
    )
    .style.display =
      "none";

  };


/* =========================================================
   CONFIRM
   ========================================================= */

document
  .getElementById(
    "confirmButton"
  )
  .onclick =
  async function() {


    if (!selected) {
      return;
    }


    /*
     * Prevent a second submission
     * from the same browser.
     */

    if (
      localStorage.getItem(
        "whereAreYouFromSubmitted"
      )
    ) {

      document.getElementById(
        "message"
      ).style.display =
        "block";


      document.getElementById(
        "message"
      ).textContent =
        "Your response has already been recorded on this device.";

      return;

    }


    const button =
      document.getElementById(
        "confirmButton"
      );


    button.disabled =
      true;


    button.textContent =
      "SENDING...";


    try {

      const response =
        await fetch(

          SUPABASE_URL +
          "/rest/v1/responses",

          {

            method:
              "POST",

            headers: {

              "apikey":
                SUPABASE_KEY,

              "Authorization":
                "Bearer " +
                SUPABASE_KEY,

              "Content-Type":
                "application/json",

              "Prefer":
                "return=minimal"

            },

            body:
              JSON.stringify({

                country_code:
                  selected[0],

                country_name:
                  selected[1]

              })

          }

        );


      if (!response.ok) {

        const errorText =
          await response.text();

        throw new Error(
          errorText
        );

      }


      localStorage.setItem(
        "whereAreYouFromSubmitted",
        "1"
      );


      document.getElementById(
        "confirmArea"
      )
      .style.display =
        "none";


      document.getElementById(
        "countryList"
      )
      .style.display =
        "none";


      document.getElementById(
        "countrySearch"
      )
      .style.display =
        "none";


      document.getElementById(
        "map"
      )
      .style.display =
        "none";


      document.getElementById(
        "message"
      ).style.display =
        "block";


      document.getElementById(
        "message"
      ).innerHTML =

        `
          <strong>Thank you! 🌍</strong>
          <br><br>
          Your answer has been added to the live map.
        `;

    }

    catch(error) {

      console.error(
        error
      );


      button.disabled =
        false;


      button.textContent =
        "CONFIRM";


      document.getElementById(
        "message"
      ).style.display =
        "block";


      document.getElementById(
        "message"
      ).textContent =

        "Sorry, something went wrong. Please try again.";

    }

  };


/* =========================================================
   INITIAL DISPLAY
   ========================================================= */

displayCountries(
  countries
);

</script>

</body>

</html>
